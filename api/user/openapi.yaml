openapi: 3.0.3
info:
  title: User API
  version: 1.0.0
  description: Profile of the authenticated user.
servers:
  - url: http://localhost:8080
paths:
  /users/me:
    get:
      operationId: getMe
      summary: Get the authenticated user's info
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User info (primary key is intentionally not returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid or revoked token
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
    patch:
      operationId: updateMe
      summary: Update the authenticated user's name and/or email
      description: Only the fields that are sent are changed. To change the password use POST /auth/change-password.
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
        "401":
          description: Missing, invalid or revoked token
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
    delete:
      operationId: deleteMe
      summary: Delete the authenticated user
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Primary key of the deleted user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserID"
        "401":
          description: Missing, invalid or revoked token
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [email, name, created_at, updated_at]
      properties:
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserUpdate:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
    UserID:
      type: object
      required: [deleted_id]
      properties:
        deleted_id:
          type: integer
          format: int64
