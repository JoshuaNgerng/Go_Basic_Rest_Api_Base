openapi: 3.0.3
info:
  title: Auth API
  version: 1.0.0
  description: Register / login / logout with PBKDF2 password hashing and JWT auth.
servers:
  - url: http://localhost:8080
paths:
  /auth/register:
    post:
      operationId: register
      summary: Register a new user
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      summary: Log in and receive a JWT
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current token
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Missing, invalid or revoked token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me:
    get:
      operationId: getMe
      summary: Get the authenticated user's info (JWT test endpoint)
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User info (primary key is intentionally not returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid or revoked token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: updateMe
      summary: update the authenticated user's info (JWT test endpoint)
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User info (primary key is intentionally not returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid or revoked token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMe
      summary: delete the authenticated user's info (JWT test endpoint)
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User primary key is that is deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserID"
        "401":
          description: Missing, invalid or revoked token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          example: alice@example.com
        name:
          type: string
          example: Alice
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: correct-horse-battery
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: alice@example.com
        password:
          type: string
          format: password
          example: correct-horse-battery
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds until expiry
    User:
      type: object
      required: [email, name, created_at, update_at]
      properties:
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        update_at:
          type: string
          format: date-time
    UserUpdate:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
    UserID:
      type: object
      properties:
        deleted_id:
          type: integer
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
