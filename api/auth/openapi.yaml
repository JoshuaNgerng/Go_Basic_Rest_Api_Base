openapi: 3.0.3
info:
  title: Auth API
  version: 1.0.0
  description: Register / login / logout / change password, with PBKDF2 password hashing and JWT auth.
servers:
  - url: http://localhost:8080
paths:
  /auth/register:
    post:
      operationId: register
      summary: Register a new user
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Message"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      summary: Log in and receive a JWT
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current token
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Message"
        "401":
          description: Missing, invalid or revoked token
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the authenticated user's password
      description: >
        Requires the current password. On success every token issued before the
        change (including the one used for this call) stops working, so the
        client must log in again.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Message"
        "400":
          description: New password does not meet the rules
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
        "401":
          description: Missing, invalid or revoked token
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
        "403":
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          example: alice@example.com
        name:
          type: string
          example: Alice
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: correct-horse-battery
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: alice@example.com
        password:
          type: string
          format: password
          example: correct-horse-battery
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds until expiry
